<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Supervisor Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container" data-reveal>
    <h1>Supervisor Dashboard</h1>
    <div th:if="${message}" class="message" th:text="${message}"></div>
    <div th:if="${error}" class="error" th:text="${error}"></div>

    <div class="toolbar">
        <a th:href="@{/supervisor/create-task}" class="button">Create New Task</a>
        <a th:href="@{/supervisor/create-employee}" class="button secondary">Create Employee</a>
        <a th:href="@{/logout}" class="button secondary">Logout</a>
    </div>

    <h2>Your Tasks</h2>
    <div class="table-wrap">
        <table>
            <tr>
                <th>ID</th><th>Title</th><th>Status</th><th>Assigned To</th><th>Actions</th>
            </tr>
            <tr th:each="task : ${tasks}">
                <td th:text="${task.id}"></td>
                <td th:text="${task.title}"></td>
                <td><span class="status" th:text="${task.status}"></span></td>
                <td th:text="${task.assignedEmployee?.username}"></td>
                <td><a th:href="@{/supervisor/task/{id}(id=${task.id})}">View</a></td>
            </tr>
        </table>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
